
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <form class="card" autocomplete="on" action="final.html" method="post" enctype="multipart/form-data" aria-label="Contact form">
      <div class="brand">
        <div class="logo">G</div>
        <div>
          <h2>Contact us</h2>
          <div class="lead">We'd love to hear from you</div>
        </div>
      </div>

      <div class="form-row">
        <label for="name">Your name</label>
        <input class="input" id="name" name="name" type="text" required placeholder="Full name" />
      </div>

      <div class="form-row">
        <label for="email">Your email</label>
        <input class="input" id="email" name="email" type="email" required placeholder="you@example.com" />
      </div>

      <div class="form-row">
        <label for="subject">Subject</label>
        <input class="input" id="subject" name="subject" type="text" placeholder="What's this about?" />
      </div>

      <div class="form-row">
        <label for="message">Your message</label>
        <textarea id="message" name="message" class="input" rows="8" placeholder="Write your message..." required></textarea>
      </div>

      <div class="form-row">
        <label for="attachment">Attachment (optional)</label>
        <input class="input" id="attachment" name="attachment" type="file" />
      </div>

      <div class="form-row">
        <button class="btn" type="submit">Send message</button>
      </div>

      <div class="small">Prefer to email? <a href="mailto:hello@example.com">hello@example.com</a></div>
    </form>
  </div>
</body>
</html>
